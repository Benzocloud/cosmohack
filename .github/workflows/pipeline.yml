name: pipeline

# PR и push рабочих веток: проверки Go, Python (если ML доставлен), frontend
# (если доставлен) и сборка Go, ML (если доставлен) и development ML stub без
# публикации. Main: то же + публикация образов в
# приватный GHCR через GITHUB_TOKEN (packages:write только здесь) и деплой
# по digest. Действия зафиксированы на проверенных SHA; версии Go/Python/Node
# берутся из файлов соответствующих каталогов. Обновления main
# сериализуются (concurrency), устаревшие PR-прогоны отменяются.
on:
  pull_request:
  push:

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GOLANGCI_LINT_VERSION: v2.13.2
  GOVULNCHECK_VERSION: v1.7.0
  RUFF_VERSION: 0.12.12

jobs:
  go-checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cosmohack
          POSTGRES_USER: cosmohack
          POSTGRES_PASSWORD: cosmohack
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cosmohack -d cosmohack"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgres://cosmohack:cosmohack@127.0.0.1:5432/cosmohack?sslmode=disable
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: fmt/vet/test with race detector
        working-directory: backend
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          docker run --rm --network host -v "$GITHUB_WORKSPACE/backend/migrations:/migrations:ro" migrate/migrate:v4.18.3 \
            -path=/migrations -database "$DATABASE_URL" up
          migration_state=$(docker run --rm --network host postgres:16-alpine \
            psql "$DATABASE_URL" -Atc "SELECT version || ':' || CASE WHEN dirty THEN 't' ELSE 'f' END FROM schema_migrations ORDER BY version DESC LIMIT 1")
          migration_version=${migration_state%%:*}
          migration_dirty=${migration_state##*:}
          test "$migration_version" -ge 1
          test "$migration_dirty" = "f"
          go vet ./...
          go test -race -count=1 ./...
      - name: lint
        working-directory: backend
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}
          # The repository contains legacy lint debt. Keep the gate incremental:
          # every changed line must pass the complete configured linter set.
          golangci-lint run --new ./...
      - name: vulnerabilities
        working-directory: backend
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}
          govulncheck ./...

  python-checks:
    # hashFiles доступен в условиях шагов после checkout, но не в job.if.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        if: ${{ hashFiles('backend/ml/requirements.txt') != '' }}
        with:
          python-version: "3.12"
      - name: lint and tests (mask/metric/csv/http contract)
        if: ${{ hashFiles('backend/ml/requirements.txt') != '' }}
        working-directory: backend/ml
        run: |
          python -m pip install --no-cache-dir -r requirements-dev.txt
          python -m pip install --no-cache-dir "ruff==${RUFF_VERSION}"
          ruff check .
          python -m pytest tests -q

  frontend-checks:
    # hashFiles доступен в условиях шагов после checkout, но не в job.if.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: ${{ hashFiles('frontend/package.json') != '' && hashFiles('frontend/package-lock.json') != '' && hashFiles('frontend/.nvmrc') != '' }}
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: typecheck and build
        if: ${{ hashFiles('frontend/package.json') != '' && hashFiles('frontend/package-lock.json') != '' && hashFiles('frontend/.nvmrc') != '' }}
        working-directory: frontend
        run: |
          npm ci
          npm run typecheck --if-present
          npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - name: build go image (no push)
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: ./Dockerfile
          push: false
      - name: build ml image (no push)
        if: ${{ hashFiles('backend/ml/requirements.txt') != '' }}
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: ./backend/ml/Dockerfile
          push: false
          load: true
          tags: cosmohack/ml:ci
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        if: ${{ hashFiles('backend/ml/requirements.txt') != '' }}
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: run ML image contract smoke test
        if: ${{ hashFiles('backend/ml/requirements.txt') != '' }}
        timeout-minutes: 5
        working-directory: backend/ml
        run: |
          set -euo pipefail
          container=cosmohack-ml-ci
          trap 'docker rm -f "$container" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$container" --publish 127.0.0.1:18000:8000 cosmohack/ml:ci
          ready=false
          for _ in $(seq 1 30); do
            if docker exec "$container" python -c 'import json, urllib.request; body=json.load(urllib.request.urlopen("http://127.0.0.1:8000/readyz")); assert body["status"] == "ready", body' >/dev/null 2>&1; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true || { docker logs "$container"; exit 1; }
          docker exec "$container" python -c 'import hashlib, json, urllib.request; body=json.load(urllib.request.urlopen("http://127.0.0.1:8000/readyz")); manifest=json.load(open("/app/ml/artifacts/manifest.json")); artifact=open("/app/ml/artifacts/restoration.pkl", "rb").read(); assert body["status"] == "ready", body; assert body["schema_version"] == "1.0", body; assert body["feature_profiles"] == ["ndvi-weather-v1"], body; assert body["model_version"] == manifest["model_version"], body; assert hashlib.sha256(artifact).hexdigest() == manifest["sha256"], manifest'
          docker cp "$GITHUB_WORKSPACE/backend/testdata/ml-http/analyze_request_example.json" "$container:/tmp/analyze_request.json"
          docker exec "$container" python -c 'import json, urllib.request; payload=json.load(open("/tmp/analyze_request.json")); request=urllib.request.Request("http://127.0.0.1:8000/v1/analyze", data=json.dumps(payload).encode(), headers={"Content-Type":"application/json", "Accept":"application/json"}); response=urllib.request.urlopen(request); result=json.load(response); assert result["request_id"] == payload["request_id"], result; assert result["area_id"] == payload["area_id"], result; assert result["input_revision"] == payload["input_revision"], result; assert result["schema_version"] == payload["schema_version"] == "1.0", result; assert result["feature_profile"] == payload["feature_profile"] == "ndvi-weather-v1", result; assert isinstance(result["series"], list) and result["series"], result'
          model_version=$(sed -n 's/.*"model_version": *"\([^"]*\)".*/\1/p' model-manifest.json)
          test -n "$model_version"
          cd "$GITHUB_WORKSPACE/backend"
          ML_CONTRACT_URL=http://127.0.0.1:18000 \
          ML_CONTRACT_MODEL_VERSION="$model_version" timeout 180s \
            go test -tags=integration -run '^TestContract_AnalyzeAgainstFastAPI$' -count=1 ./internal/service/ml
      - name: build development ML stub image (no push)
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: ./deploy/ml-stub
          file: ./deploy/ml-stub/Dockerfile
          push: false

  publish:
    # Публикация Go и ML/stub-образов только для main в приватный GHCR;
    # packages:write только здесь. Имя репозитория приводится к lowercase:
    # registry принимает только строчные пути.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [go-checks, python-checks, frontend-checks, docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      go_digest: ${{ steps.go.outputs.digest }}
      ml_digest: ${{ steps.ml.outputs.digest }}
      ml_stub_digest: ${{ steps.ml_stub.outputs.digest }}
      ml_present: ${{ steps.ml_guard.outputs.present }}
      image_repo: ${{ steps.repo.outputs.repo }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - id: repo
        run: echo "repo=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - id: ml_guard
        run: echo "present=$([ -f backend/ml/requirements.txt ] && [ -f backend/ml/PRODUCTION_READY ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: go
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.repo }}/go
      - id: ml
        if: ${{ steps.ml_guard.outputs.present == 'true' }}
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: ./backend/ml/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.repo }}/ml
      - id: ml_stub
        if: ${{ steps.ml_guard.outputs.present != 'true' }}
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: ./deploy/ml-stub
          file: ./deploy/ml-stub/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.repo }}/ml-stub

  deploy:
    # Деплой запускается на выделенном self-hosted runner после зелёного main,
    # когда владелец включил переменную DEPLOY_ENABLED. Runner находится на
    # целевой машине, поэтому SSH-доставка не используется.
    # Секреты: GHCR_USER/GHCR_TOKEN (read:packages), DATABASE_URL;
    # версия модели читается из зафиксированного manifest.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.publish.outputs.ml_present == 'true' && vars.DEPLOY_ENABLED == 'true'
    needs: publish
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: deploy release by digests
        env:
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
          GO_DIGEST: ${{ needs.publish.outputs.go_digest }}
          ML_DIGEST: ${{ needs.publish.outputs.ml_digest }}
          IMAGE_REPO: ${{ needs.publish.outputs.image_repo }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/cosmohack' }}
        run: |
          MODEL_VERSION=$(sed -n 's/.*"model_version": *"\([^"]*\)".*/\1/p' backend/ml/model-manifest.json)
          export MODEL_VERSION
          test -n "$GHCR_USER" && test -n "$GHCR_TOKEN" \
            && test -n "$CDSE_CLIENT_ID" && test -n "$CDSE_CLIENT_SECRET" \
            && test -n "$MODEL_VERSION" \
            || { echo "GHCR/CDSE secrets or MODEL_VERSION are not configured"; exit 1; }
          test -n "$DATABASE_URL" || { echo "DATABASE_URL secret is not configured"; exit 1; }
          test -n "$GO_DIGEST" && test -n "$ML_DIGEST" && test -n "$IMAGE_REPO" \
            || { echo "published image digests are missing"; exit 1; }
          run_as_root() {
            if [ "$(id -u)" -eq 0 ]; then
              "$@"
            else
              sudo -n --preserve-env=GO_IMAGE,ML_IMAGE,MODEL_VERSION,MIGRATIONS_DIR_HOST "$@"
            fi
          }
          run_as_root install -d -m 0750 "$DEPLOY_DIR"
          run_as_root install -m 0755 deploy/deploy.sh "$DEPLOY_DIR/deploy.sh"
          run_as_root install -m 0644 deploy/compose.yaml "$DEPLOY_DIR/compose.yaml"
          run_as_root install -d -m 0755 "$DEPLOY_DIR/migrations"
          run_as_root install -m 0644 backend/migrations/*.sql "$DEPLOY_DIR/migrations/"
          release_env=$(mktemp)
          trap 'rm -f "$release_env"' EXIT
          umask 077
          printf 'GHCR_USER=%s\nGHCR_TOKEN=%s\nDATABASE_URL=%s\nCDSE_CLIENT_ID=%s\nCDSE_CLIENT_SECRET=%s\n' \
            "$GHCR_USER" "$GHCR_TOKEN" "$DATABASE_URL" "$CDSE_CLIENT_ID" "$CDSE_CLIENT_SECRET" > "$release_env"
          run_as_root install -m 0600 "$release_env" "$DEPLOY_DIR/release-ghcr.env"
          export GO_IMAGE="ghcr.io/${IMAGE_REPO}/go@${GO_DIGEST}"
          export ML_IMAGE="ghcr.io/${IMAGE_REPO}/ml@${ML_DIGEST}"
          export MIGRATIONS_DIR_HOST=./migrations
          run_as_root "$DEPLOY_DIR/deploy.sh"

  deploy-stub:
    # До поставки настоящего ML запускаем production Go с образом ML stub на
    # том же self-hosted runner. Production deploy остаётся закрыт без ML.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.publish.outputs.ml_present != 'true' && vars.DEPLOY_ENABLED == 'true'
    needs: publish
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: deploy Go with development ML stub
        env:
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
          GO_DIGEST: ${{ needs.publish.outputs.go_digest }}
          ML_STUB_DIGEST: ${{ needs.publish.outputs.ml_stub_digest }}
          IMAGE_REPO: ${{ needs.publish.outputs.image_repo }}
          MODEL_VERSION: ${{ vars.MODEL_VERSION || 'dev-stub' }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR || '/opt/cosmohack' }}
        run: |
          test -n "$GHCR_USER" && test -n "$GHCR_TOKEN" \
            && test -n "$CDSE_CLIENT_ID" && test -n "$CDSE_CLIENT_SECRET" \
            || { echo "GHCR/CDSE secrets are not configured"; exit 1; }
          test -n "$DATABASE_URL" || { echo "DATABASE_URL secret is not configured"; exit 1; }
          test -n "$GO_DIGEST" && test -n "$ML_STUB_DIGEST" && test -n "$IMAGE_REPO" \
            || { echo "published Go or ML stub image digest is missing"; exit 1; }
          run_as_root() {
            if [ "$(id -u)" -eq 0 ]; then
              "$@"
            else
              sudo -n --preserve-env=GO_IMAGE,ML_IMAGE,MODEL_VERSION,MIGRATIONS_DIR_HOST "$@"
            fi
          }
          run_as_root install -d -m 0750 "$DEPLOY_DIR"
          run_as_root install -m 0755 deploy/deploy.sh "$DEPLOY_DIR/deploy.sh"
          run_as_root install -m 0644 deploy/compose.yaml "$DEPLOY_DIR/compose.yaml"
          run_as_root install -d -m 0755 "$DEPLOY_DIR/migrations"
          run_as_root install -m 0644 backend/migrations/*.sql "$DEPLOY_DIR/migrations/"
          release_env=$(mktemp)
          trap 'rm -f "$release_env"' EXIT
          umask 077
          printf 'GHCR_USER=%s\nGHCR_TOKEN=%s\nDATABASE_URL=%s\nCDSE_CLIENT_ID=%s\nCDSE_CLIENT_SECRET=%s\n' \
            "$GHCR_USER" "$GHCR_TOKEN" "$DATABASE_URL" "$CDSE_CLIENT_ID" "$CDSE_CLIENT_SECRET" > "$release_env"
          run_as_root install -m 0600 "$release_env" "$DEPLOY_DIR/release-ghcr.env"
          export GO_IMAGE="ghcr.io/${IMAGE_REPO}/go@${GO_DIGEST}"
          export ML_IMAGE="ghcr.io/${IMAGE_REPO}/ml-stub@${ML_STUB_DIGEST}"
          export MODEL_VERSION
          export MIGRATIONS_DIR_HOST=./migrations
          run_as_root "$DEPLOY_DIR/deploy.sh"
