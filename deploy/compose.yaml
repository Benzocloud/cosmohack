# Local and production-shaped Compose stack. PostgreSQL is the source of truth;
# migrations complete before Go starts.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cosmohack}
      POSTGRES_USER: ${POSTGRES_USER:-cosmohack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cosmohack}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    image: migrate/migrate:v4.18.3
    command: ["-path=/migrations", "-database", "${DATABASE_URL:-postgres://cosmohack:cosmohack@postgres:5432/cosmohack?sslmode=disable}", "up"]
    volumes:
      - ${MIGRATIONS_DIR_HOST:-../backend/migrations}:/migrations:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  go:
    image: ${GO_IMAGE:?GO_IMAGE is required}
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://cosmohack:cosmohack@postgres:5432/cosmohack?sslmode=disable}
      DB_TIMEOUT: ${DB_TIMEOUT:-5s}
      ML_BASE_URL: http://ml:8000
      ML_MODEL_VERSION: ${MODEL_VERSION:?MODEL_VERSION is required}
      CDSE_CLIENT_ID: ${CDSE_CLIENT_ID:-}
      CDSE_CLIENT_SECRET: ${CDSE_CLIENT_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      ml:
        condition: service_healthy
    restart: unless-stopped

  ml:
    image: ${ML_IMAGE:?ML_IMAGE is required}
    environment:
      MODEL_VERSION: ${MODEL_VERSION:?MODEL_VERSION is required}
    volumes:
      - ${ML_ARTIFACTS_DIR_HOST:-./data/ml-artifacts}:/app/ml/artifacts:ro
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  ml-stub:
    profiles: ["dev-ml-stub"]
    build:
      context: ./ml-stub
    environment:
      MODEL_VERSION: ${MODEL_VERSION:-dev-stub}
      STUB_MODE: ${ML_STUB_MODE:-}
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 3s
      timeout: 2s
      retries: 10

  go-stub:
    profiles: ["dev-ml-stub"]
    image: ${GO_IMAGE:?GO_IMAGE is required}
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://cosmohack:cosmohack@postgres:5432/cosmohack?sslmode=disable}
      DB_TIMEOUT: ${DB_TIMEOUT:-5s}
      ML_BASE_URL: http://ml-stub:8000
      ML_MODEL_VERSION: ${MODEL_VERSION:-dev-stub}
      CDSE_CLIENT_ID: ${CDSE_CLIENT_ID:-}
      CDSE_CLIENT_SECRET: ${CDSE_CLIENT_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      ml-stub:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
